name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
      build_changed: ${{ steps.classifier.outputs.build_changed }}
      workflow_changed: ${{ steps.classifier.outputs.workflow_changed }}
    steps:
      - name: Checkout landed revision
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Resolve changed files
        env:
          BEFORE_REVISION: ${{ github.event.before }}
        run: |
          set -euo pipefail
          before_revision=${BEFORE_REVISION:-}
          if [[ ! "$before_revision" =~ ^[0-9a-fA-F]{40}$ ]] || \
             [[ "$before_revision" == 0000000000000000000000000000000000000000 ]]; then
            before_revision=$(git rev-parse HEAD^)
          fi
          git diff --name-only "$before_revision" "$GITHUB_SHA" > .changed-files
      - name: Classify change
        id: classifier
        run: node .github/agents/classify_changes.js --files-from .changed-files >> "$GITHUB_OUTPUT"
      - id: timestamp
        run: echo "value=$(date +%s)" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.build_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-glibc-x64
          - linux-glibc-aarch64
          - linux-musl-x64
          - linux-musl-aarch64
          - macos-aarch64
          - windows-x64
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      build_timestamp: ${{ needs.prepare.outputs.timestamp }}
      source_revision: ${{ github.sha }}

  compliance-regression:
    name: Ant Regression Gate
    needs: prepare
    if: needs.prepare.outputs.build_changed == 'true'
    uses: ./.github/workflows/compliance-gate.yml
    with:
      suite: regression
      source_revision: ${{ github.sha }}
      logical_branch: main
      baseline_revision: ${{ github.sha }}

  compliance-wintertc:
    name: WinterTC Gate
    needs: prepare
    if: needs.prepare.outputs.build_changed == 'true'
    uses: ./.github/workflows/compliance-gate.yml
    with:
      suite: wintertc
      source_revision: ${{ github.sha }}
      logical_branch: main
      baseline_revision: ${{ github.sha }}

  workflow-lint:
    name: Workflow Lint
    needs: prepare
    if: needs.prepare.outputs.workflow_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate workflows
        run: actionlint -ignore SC2086 -ignore SC2129 .github/workflows/*.yml

  repo-knowledge:
    name: Repo Knowledge
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Validate repo knowledge docs
        run: node .github/agents/check_repo_knowledge.js
      - name: Collect changed files
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > .changed-files
          else
            git ls-files > .changed-files
          fi
      - name: Validate changed-file structure
        run: node .github/agents/check_repo_structure.js --files-from .changed-files
      - name: Suggest validation commands
        run: node .github/agents/route_validation.js --files-from .changed-files
