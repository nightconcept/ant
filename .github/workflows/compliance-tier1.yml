name: Compliance Tier 1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance-tier1:
    name: Tier 1 Compliance (Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang
          pip install --break-system-packages -U meson

      - name: Configure build
        run: meson setup build -Dbuildtype=release

      - name: Compile Ant
        run: meson compile -C build

      - name: Run Tier 1 Compliance Suite
        run: python3 scripts/run_compliance.py --tier 1 --all
