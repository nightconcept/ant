name: Test262 Weekly

# The pinned Test262 corpus is too large to sit in front of every push. This
# scheduled run compares exact failing-test names against the trusted baseline.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compliance-test262:
    name: Test262 (main)
    runs-on: ubuntu-latest
    concurrency:
      group: test262-weekly-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main

      - name: Record checked-out source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache jq
          pip install --break-system-packages -U meson

      - name: Resolve pinned tool versions
        id: config
        run: |
          TOOLS=$(jq -r '.tools' .github/versions.json)
          echo "llvm_version=$(echo $TOOLS | jq -r '.llvm')" >> $GITHUB_OUTPUT

      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ steps.config.outputs.llvm_version }}
          os_type: linux-glibc

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.16.0"

      - name: Setup build caches
        uses: ./.github/actions/setup-build-caches
        with:
          platform: test262-main-linux-x64
          compiler_version: llvm-${{ steps.config.outputs.llvm_version }}
          zig_version: "0.16.0"

      - name: Configure build
        env:
          CC: ccache ${{ steps.llvm.outputs.cc }}
          CXX: ccache ${{ steps.llvm.outputs.cxx }}
        run: meson setup build -Dbuildtype=release

      - name: Compile Ant
        env:
          CC: ccache ${{ steps.llvm.outputs.cc }}
          CXX: ccache ${{ steps.llvm.outputs.cxx }}
        run: meson compile -C build

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Run Test262 tracking
        run: python3 scripts/run_compliance.py --suite test262 --all --allow-failures --log

      - name: Check Test262 exact failing set against baseline
        run: |
          python3 scripts/compliance_baseline.py diff \
            .deps/compliance/logs/test262-latest.json \
            --require-baseline \
            --require-full \
            --expect-commit "${{ steps.source.outputs.commit }}" \
            --expect-branch main

      - name: Upload Test262 manifest and log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: test262-compliance-main
          path: .deps/compliance/logs/test262_*
          if-no-files-found: error
