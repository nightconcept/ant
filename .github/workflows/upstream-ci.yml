name: CI

on:
  push:
    branches: [upstream]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.value }}
    steps:
      - id: timestamp
        run: echo "value=$(date +%s)" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Build and Test (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux-glibc-x64
          - linux-glibc-aarch64
          - linux-musl-x64
          - linux-musl-aarch64
          - macos-aarch64
          - windows-x64
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ${{ matrix.platform }}
      build_timestamp: ${{ needs.prepare.outputs.timestamp }}
      source_revision: ${{ github.sha }}

  compliance-tier2:
    name: Compliance (Tier 2, Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache jq
          pip install --break-system-packages -U meson

      # The compliance job builds Ant itself, so it needs the same pinned
      # toolchain as the platform builds. The runner's default clang is older
      # than the C23 the engine now requires (`constexpr` in include/internal.h,
      # from upstream's "improve async ops"), and fails to compile src/ant.c.
      - name: Resolve pinned tool versions
        id: config
        run: |
          TOOLS=$(jq -r '.tools' .github/versions.json)
          echo "llvm_version=$(echo $TOOLS | jq -r '.llvm')" >> $GITHUB_OUTPUT

      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ steps.config.outputs.llvm_version }}
          os_type: linux-glibc

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.16.0"

      - name: Setup build caches
        uses: ./.github/actions/setup-build-caches
        with:
          platform: compliance-linux-x64
          compiler_version: llvm-${{ steps.config.outputs.llvm_version }}
          zig_version: "0.16.0"

      - name: Configure build
        env:
          CC: ccache ${{ steps.llvm.outputs.cc }}
          CXX: ccache ${{ steps.llvm.outputs.cxx }}
        run: meson setup build -Dbuildtype=release

      - name: Compile Ant
        env:
          CC: ccache ${{ steps.llvm.outputs.cc }}
          CXX: ccache ${{ steps.llvm.outputs.cxx }}
        run: meson compile -C build

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Run Tier 2 Compliance Tracking
        run: python3 scripts/run_compliance.py --tier 2 --all --allow-failures --log

      - name: Check tier 2 pass counts against baseline
        run: |
          python3 - <<'PYEOF'
          import json, sys, pathlib

          baseline = json.loads(pathlib.Path("docs/repo/compliance-baseline.json").read_text())["tiers"]
          logs = sorted(pathlib.Path(".deps/compliance/logs").glob("*.json"))

          failed = False
          for tier in ("2",):
              if tier not in baseline:
                  print(f"Tier {tier}: no baseline seeded yet, skipping regression check")
                  continue
              manifest_path = next((p for p in logs if f"tier{tier}_" in p.name), None)
              if manifest_path is None:
                  print(f"::error::Tier {tier}: no manifest produced by this run")
                  failed = True
                  continue
              manifest = json.loads(manifest_path.read_text())
              base_passed = baseline[tier]["totals"]["passed"]
              cur_passed = manifest["totals"]["passed"]
              print(f"Tier {tier}: baseline passed={base_passed}, current passed={cur_passed}")
              if cur_passed < base_passed:
                  print(f"::error::Tier {tier} regressed: {cur_passed} passed vs baseline {base_passed}")
                  failed = True

          sys.exit(1 if failed else 0)
          PYEOF

      # The benchmark threshold gate is deliberately not run here. It diffs
      # absolute milliseconds against docs/repo/bench-baseline.json, which is
      # recorded on a developer machine, so on a runner every benchmark reads as
      # 15-47% slower and the gate fails without a code change. Gating on the
      # ratio to node instead does not work either: measured between two runs of
      # identical code on one machine, node drifts up to 15% (28% once its
      # startup floor is subtracted) against Ant's own 5%, so the reference is
      # noisier than the subject. Tracked in
      # docs/exec-plans/tech-debt.md; performance is gated locally via
      # `just bench-fast-diff` in the meantime.

  repo-knowledge:
    name: Repo Knowledge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Validate repo knowledge docs
        run: node .github/agents/check_repo_knowledge.js
      - name: Collect changed files
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > .changed-files
          else
            git ls-files > .changed-files
          fi
      - name: Validate changed-file structure
        run: node .github/agents/check_repo_structure.js --files-from .changed-files
      - name: Suggest validation commands
        run: node .github/agents/route_validation.js --files-from .changed-files
