name: Tier 3 Weekly

# Tier 3 is ~50k Test262/WPT tests and takes far too long to sit in front of a
# push. It runs on a schedule against `main` and compares the exact failing-test
# set with the checked-in trusted baseline.
on:
  schedule:
    # Mondays, 04:00 UTC - off-peak, and a full working week before anyone is
    # likely to be looking at the result.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  compliance-tier3:
    name: Compliance (Tier 3, main)
    runs-on: ubuntu-latest
    concurrency:
      group: tier3-weekly-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main

      - name: Record checked-out source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache jq
          pip install --break-system-packages -U meson

      # Same pinned toolchain as the platform builds: the runner's default clang
      # is older than the C23 the engine requires and cannot compile src/ant.c.
      - name: Resolve pinned tool versions
        id: config
        run: |
          TOOLS=$(jq -r '.tools' .github/versions.json)
          echo "llvm_version=$(echo $TOOLS | jq -r '.llvm')" >> $GITHUB_OUTPUT

      - name: Setup LLVM
        id: llvm
        uses: ./.github/actions/setup-llvm
        with:
          version: ${{ steps.config.outputs.llvm_version }}
          os_type: linux-glibc

      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.16.0"

      - name: Setup build caches
        uses: ./.github/actions/setup-build-caches
        with:
          platform: compliance-main-linux-x64
          compiler_version: llvm-${{ steps.config.outputs.llvm_version }}
          zig_version: "0.16.0"

      - name: Configure build
        env:
          CC: ccache ${{ steps.llvm.outputs.cc }}
          CXX: ccache ${{ steps.llvm.outputs.cxx }}
        run: meson setup build -Dbuildtype=release

      - name: Compile Ant
        env:
          CC: ccache ${{ steps.llvm.outputs.cc }}
          CXX: ccache ${{ steps.llvm.outputs.cxx }}
        run: meson compile -C build

      - name: Report compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Run Tier 3 Compliance Tracking
        run: python3 scripts/run_compliance.py --tier 3 --all --allow-failures --log

      - name: Check tier 3 exact failing set against baseline
        run: |
          python3 scripts/compliance_baseline.py diff \
            .deps/compliance/logs/tier3-latest.json \
            --require-baseline \
            --require-full \
            --expect-commit "${{ steps.source.outputs.commit }}" \
            --expect-branch main

      - name: Upload tier 3 manifest and log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tier3-compliance-main
          path: .deps/compliance/logs/tier3_*
          if-no-files-found: error
